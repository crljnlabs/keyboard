; PlatformIO Project Configuration File
;
; Firmware for the custom keypad.
; Target: ESP32-S3 Super Mini (module ESP32-S3FH4R2 -> 4 MB flash, 2 MB PSRAM).
;
; The authoritative hardware definition is the KiCad project in kicad/
; (see kicad/Keypad.kicad_sch for the net names of encoder, TFT and switches).
;
; Documentation: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = supermini

[env:supermini]
; Arduino core 3.3.12 (ESP-IDF 5.5.5) through pioarduino, the community
; continuation of the platform: PlatformIO's own espressif32 stops at core
; 2.0.17. Pinned to a release for reproducible builds.
;
; Core 2.0.17 is not an option. Its USB driver (TinyUSB 0.16, esp32sx) drops
; the keypad off the bus when input reports go out while display packets come
; in: the Mac aborts the transfer and enumerates the device anew, after
; anything from 0.5 to 10 s. Reproduced without anyone at the knob by a test
; build sending a report every 10 ms. Core 3 brings TinyUSB's dwc2 driver.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; PlatformIO has no dedicated board definition for the "ESP32-S3 Super Mini".
; DevKitC-1 is the generic ESP32-S3 base; flash size, flash mode and PSRAM are
; overridden below to match the ESP32-S3FH4R2 module actually used.
board = esp32-s3-devkitc-1
framework = arduino

; --- module / memory layout -------------------------------------------------
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = qio
; Quad SPI flash + quad SPI PSRAM (the FH4R2 has no octal PSRAM).
board_build.arduino.memory_type = qio_qspi
; 4 MB layout: 2 x 1.25 MB app slots (OTA capable) + SPIFFS.
board_build.partitions = default.csv

; --- USB --------------------------------------------------------------------
; The DevKitC-1 board definition hardcodes -DARDUINO_USB_MODE=1 (the fixed
; USB-Serial-JTAG bridge). Its flags are restated here with USB_MODE=0, which
; selects the TinyUSB (USB-OTG) stack - required to expose a vendor-defined HID
; interface instead of a standard keyboard. Overriding the whole list instead of
; appending also avoids a "redefined" warning in every compilation unit.
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=0
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1

; ARDUINO_USB_CDC_ON_BOOT=1 adds a CDC serial interface to the same composite
; device, so serial logging stays available next to the HID interface.
;
; The display needs no flags: its panel, size and pins are in src/main.cpp,
; and the anydeck library brings LovyanGFX, which drives it.
;
; The names the keypad gives itself over USB are not build flags: they are in
; src/main.cpp, and the anydeck library hands them to the USB stack.
;
; The -I for FS: core 3's USB library includes FS.h (USBMSCFS.h, for a USB
; stick on the host side) and names FS in its library.properties, but
; PlatformIO's dependency finder never hands FS's include path to the USB
; library - in none of its modes - and the build stops there.
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=1
	-I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

; --- libraries --------------------------------------------------------------
; The anydeck library does everything between the keypad and the PC: USB, the
; reports, the display pieces. Fetched from GitHub; scripts/build.py fetches its
; newest commit before every build, since PlatformIO keeps the one it fetched
; first. To work on it alongside, name the folder next to this repository
; instead: symlink://../anydeck-library. It brings LovyanGFX along, which
; talks to the ST7789 panel.
lib_deps = https://github.com/crljnlabs/anydeck-library.git

; --- upload / monitor -------------------------------------------------------
upload_speed = 921600
monitor_speed = 115200
; Native USB CDC via TinyUSB: DTR has to be asserted. Arduino's USBCDC::write()
; drops every byte while tud_cdc_n_connected() is false, and TinyUSB defines
; "connected" as exactly "DTR asserted" - with monitor_dtr = 0 the firmware
; prints into the void. Toggling DTR/RTS only resets the chip on the
; USB-Serial-JTAG bridge (ARDUINO_USB_MODE=1); this build uses the TinyUSB
; stack (USB_MODE=0), where it does not.
monitor_dtr = 1
monitor_rts = 1
monitor_filters =
	esp32_exception_decoder
	time

