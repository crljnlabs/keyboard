; PlatformIO Project Configuration File
;
; Firmware for the custom keypad.
; Target: ESP32-S3 Super Mini (module ESP32-S3FH4R2 -> 4 MB flash, 2 MB PSRAM).
;
; The authoritative hardware definition is the KiCad project in kicad/
; (see kicad/Keypad.kicad_sch for the net names of encoder, TFT and switches).
;
; Documentation: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = supermini

[env:supermini]
; Pinned for reproducible builds; espressif32 6.12.0 ships Arduino core 2.0.17.
platform = espressif32@6.12.0
; PlatformIO has no dedicated board definition for the "ESP32-S3 Super Mini".
; DevKitC-1 is the generic ESP32-S3 base; flash size, flash mode and PSRAM are
; overridden below to match the ESP32-S3FH4R2 module actually used.
board = esp32-s3-devkitc-1
framework = arduino

; --- module / memory layout -------------------------------------------------
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = qio
; Quad SPI flash + quad SPI PSRAM (the FH4R2 has no octal PSRAM).
board_build.arduino.memory_type = qio_qspi
; 4 MB layout: 2 x 1.25 MB app slots (OTA capable) + SPIFFS.
board_build.partitions = default.csv

; --- USB --------------------------------------------------------------------
; The DevKitC-1 board definition hardcodes -DARDUINO_USB_MODE=1 (the fixed
; USB-Serial-JTAG bridge). Its flags are restated here with USB_MODE=0, which
; selects the TinyUSB (USB-OTG) stack - required to expose a vendor-defined HID
; interface instead of a standard keyboard. Overriding the whole list instead of
; appending also avoids a "redefined" warning in every compilation unit.
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=0
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1

; ARDUINO_USB_CDC_ON_BOOT=1 adds a CDC serial interface to the same composite
; device, so serial logging stays available next to the HID interface.
;
; --- TFT_eSPI setup ---------------------------------------------------------
; TFT_eSPI is configured at compile time only. USER_SETUP_LOADED=1 makes the
; library skip its bundled User_Setup.h, so the checkout of the dependency
; stays pristine and the build is reproducible.
;
; USE_HSPI_PORT is REQUIRED on the ESP32-S3 and must not be removed. Without it
; TFT_eSPI crashes inside tft.init() with a null pointer write, because its two
; ways of naming the SPI peripheral disagree:
;
;   * the SPI object comes from "SPIClass& spi = SPI", i.e. Arduino bus index
;     FSPI, which is 0 on the S3 and means the SPI2 peripheral;
;   * the direct register access uses REG_SPI_BASE(SPI_PORT) with the same
;     value 0, but that macro counts peripheral numbers, and the IDF defines it
;     as "(((i)>=2) ? (DR_REG_SPI2_BASE + (i-2)*0x1000) : (0))" - so index 0
;     yields address 0, and the first *_spi_user write hits a null pointer.
;
; TFT_eSPI ships a compensating REG_SPI_BASE definition, but it sits behind
; "#ifndef REG_SPI_BASE" and the IDF already defines the macro, so it never
; applies. USE_HSPI_PORT makes both sides agree on SPI3: the object becomes
; SPIClass(HSPI) = bus index 1 = SPI3, and SPI_PORT becomes 3, which
; REG_SPI_BASE maps to the SPI3 base address.
;
; TFT_WIDTH/TFT_HEIGHT describe the mounted 1.69" 240(RGB)x280 IPS panel. Both
; values have to stay exactly as they are unless the panel is swapped: TFT_eSPI
; derives the panel's CGRAM offset (rowstart 20 in portrait) from this specific
; width/height pair, and a mismatch shifts the whole image.
;
; The TFT_* pin macros mirror include/pins.h and must be kept in sync with it;
; TFT_eSPI needs literal macros and cannot read the constants from that header.
; They intentionally do NOT match the schematic net names - one ESP32 header on
; the PCB is wired upside down. include/pins.h documents the full mapping.
;
; TFT_BL is deliberately NOT defined. The backlight on GPIO4 is owned by the
; Display class, which drives it via LEDC to allow dimming - letting TFT_eSPI
; claim the pin as well would fight the PWM with a plain digitalWrite.
;
; SPI_FREQUENCY: 40 MHz is the safe value for the ribbon length of these
; modules. 80 MHz works on many of them but glitches on some.
;
; DISABLE_ALL_LIBRARY_WARNINGS silences TFT_eSPI's "TOUCH_CS pin not defined"
; #warning. The panel has no touch controller - its 8-pin header carries only
; GND, VCC, SCL, SDA, RES, DC, CS and BLK - so there is nothing to configure.
;
; USB_PRODUCT is the name the device gives itself over USB, and so the name it
; has in anydeck until somebody renames it. Without it the Arduino core falls
; back to the board definition's name, "Espressif ESP32-S3-DevKitC-1-N8 (8 MB
; QD, No PSRAM)" - the wrong board, and not a name anybody would choose.
build_flags =
	-D USB_PRODUCT=\"crljn-board\"
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=1
	-D USER_SETUP_LOADED=1
	-D USE_HSPI_PORT=1
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=280
	-D TFT_MOSI=44
	-D TFT_SCLK=43
	-D TFT_CS=3
	-D TFT_DC=2
	-D TFT_RST=1
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=40000000
	-D DISABLE_ALL_LIBRARY_WARNINGS=1

; --- libraries --------------------------------------------------------------
; TFT_eSPI talks to the ST7789 panel. It is configured exclusively through the
; build flags below (USER_SETUP_LOADED=1), so the library's own User_Setup.h is
; never touched and the checkout stays reproducible.
lib_deps =
	bodmer/TFT_eSPI@^2.5.43

; --- upload / monitor -------------------------------------------------------
upload_speed = 921600
monitor_speed = 115200
; Native USB CDC via TinyUSB: DTR has to be asserted. Arduino's USBCDC::write()
; drops every byte while tud_cdc_n_connected() is false, and TinyUSB defines
; "connected" as exactly "DTR asserted" - with monitor_dtr = 0 the firmware
; prints into the void. Toggling DTR/RTS only resets the chip on the
; USB-Serial-JTAG bridge (ARDUINO_USB_MODE=1); this build uses the TinyUSB
; stack (USB_MODE=0), where it does not.
monitor_dtr = 1
monitor_rts = 1
monitor_filters =
	esp32_exception_decoder
	time

